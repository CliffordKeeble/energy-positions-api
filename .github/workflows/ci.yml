# The whole test suite against PostgreSQL 17, on every pull request and every push
# to main. On a push to main, and only once the tests have passed, the image is built
# and published to GitHub Container Registry, tagged with the commit and with latest.
# Then the app on Azure Container Apps is pointed at that commit's image, and a smoke
# check of the live app, which can fail, is the last step.
#
# No secret beyond the GITHUB_TOKEN that every run is given. The sign-in to Azure is
# by OpenID Connect: Azure trusts a token GitHub issues to a run of this repository
# on main, so there is no Azure password or key to store. Each action is pinned to a
# commit, with its release tag beside it.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests on PostgreSQL 17
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: positions
          POSTGRES_PASSWORD: positions
          POSTGRES_DB: positions
        # The same port as compose.yaml, so the tests find it with no settings.
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U positions -d positions"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Install Python and the locked dependencies
        run: uv sync --frozen
      # One test is a strict expected failure (exercise 2): if it ever passes, the run fails.
      - name: Run the whole suite
        run: uv run --frozen pytest -ra

  publish:
    name: publish the image to ghcr.io
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The name is written out in lower case: a registry refuses capitals, and the
      # account name has them.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cliffordkeeble/energy-positions-api:${{ github.sha }}
            ghcr.io/cliffordkeeble/energy-positions-api:latest

  deploy:
    name: deploy this commit to Azure Container Apps
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # One deployment at a time. Two that overlapped would each find the other's image
    # serving, and the smoke check would rightly fail one of them.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      id-token: write # to ask GitHub for the token that Azure exchanges for a sign-in
      contents: read # to check out the smoke check
    env:
      LIVE_URL: https://energy-positions-api.politerock-e062906b.uksouth.azurecontainerapps.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The three values are identifiers, held as repository variables, not secrets.
      # What Azure trusts is the token's subject, this repository on main, and that
      # cannot be claimed by a run of anything else.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Add the Container Apps commands to the Azure CLI, without a prompt
        run: az extension add --name containerapp --upgrade --yes
      # The commit's own tag and never latest: what goes live is the image that was
      # built from the commit the tests passed on. Only the new revision's name is
      # printed, not the whole description of the app.
      - name: Point the app at this commit's image
        run: >-
          az containerapp update
          --name energy-positions-api
          --resource-group rg-energy-positions
          --image "ghcr.io/cliffordkeeble/energy-positions-api:${{ github.sha }}"
          --query properties.latestRevisionName
          --output tsv
      # This step can fail, and a green run means only that it did not. It goes red if,
      # within 300 seconds, either of these is not seen:
      #   (a) every revision that carries traffic runs this commit's tag;
      #   (b) the live endpoint answers 200 with a settlement_period and a net_mwh.
      # So it goes red if the step above is pointed at any other tag, or at one that
      # does not exist (the old revision then keeps the traffic), and if the path below
      # is wrong. The tag is written out again here, on purpose: a check that read it
      # from the step above would agree with whatever that step did.
      # The time to the first 200 is printed, and is on the run's summary page.
      - name: Smoke check, which can fail
        run: >-
          python3 scripts/smoke_check.py
          --app energy-positions-api
          --resource-group rg-energy-positions
          --expect-image "ghcr.io/cliffordkeeble/energy-positions-api:${{ github.sha }}"
          --url "$LIVE_URL/portfolios/7/positions/current"
