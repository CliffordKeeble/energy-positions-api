[project]
name = "energy-positions-api"
version = "0.1.0"
description = "A FastAPI and PostgreSQL demo built around GB half-hourly settlement periods."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.5",
    "pydantic>=2.14.3",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_positions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs the PostgreSQL container (docker compose up -d --wait)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
